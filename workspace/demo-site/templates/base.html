<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}JARVIS Demo{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head>
<body>
<nav class="nav"><a class="brand" href="{{ url_for('index') }}">JARVIS<span>/demo</span></a><div>{% if g.user %}<a href="{{ url_for('dashboard') }}">Dashboard</a><form class="inline" method="post" action="{{ url_for('logout') }}"><button class="link-button" type="submit">Sair</button></form>{% else %}<a href="{{ url_for('login') }}">Entrar</a>{% endif %}</div></nav>
<main class="container">{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
</body></html>
