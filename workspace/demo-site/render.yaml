services:
  - type: web
    name: jarvis-demo-login
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_DATABASE
        value: /tmp/app.sqlite3
