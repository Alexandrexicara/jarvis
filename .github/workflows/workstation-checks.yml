name: Jarvis workstation checks

on:
  workflow_dispatch:
  push:
    branches:
      - feat/jarvis-windows-workstation
  pull_request:
    branches:
      - feat/jarvis-windows-workstation

permissions:
  contents: read

concurrency:
  group: jarvis-workstation-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compile and test workstation policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests flask "psycopg[binary]"
      - name: Compile Python modules
        run: python -m compileall -q jarvis.py workstation_api.py workstation_queue.py workstation_agent tests
      - name: Run workstation policy tests
        run: python -m pytest -q tests/test_workstation_policy.py
