

services:
  - type: web
    name: jarvis-voz-agente
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m playwright install chromium"
    startCommand: "python jarvis.py"
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        sync: false
      - key: NVIDIA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: DEALWORK_AGENT_ID
        sync: false
      - key: DEALWORK_API_KEY
        sync: false
      - key: DEALWORK_HMAC_SECRET
        sync: false
      - key: DEALWORK_API_BASE
        value: https://dealwork.ai/api/v1
